<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARYAAHI 🌙🌸</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle at 50% 20%,#43245f,#180c2d 45%,#05020b 100%);
    color:white;
}

/* STARS */
.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.6)}
    to{opacity:1;transform:scale(1.5)}
}

/* MOON */
.moon{
    position:fixed;
    top:45px;
    left:50%;
    transform:translateX(-50%);
    width:110px;
    height:110px;
    border-radius:50%;
    background:#fff8d8;
    box-shadow:
    0 0 25px #fff4b0,
    0 0 70px rgba(255,238,160,.5);
}

/* SCROLL AREA */
.scroll-area{
    position:relative;
    z-index:5;
    height:100vh;
    overflow-y:auto;
    padding:170px 18px 50px;
    scroll-behavior:smooth;
}

.scroll-area::-webkit-scrollbar{
    width:5px;
}

.scroll-area::-webkit-scrollbar-thumb{
    background:#ff8dcc;
    border-radius:10px;
}

/* CARD */
.card{
    width:min(100%,520px);
    margin:auto;
    text-align:center;
    padding:35px 22px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 0 50px rgba(255,100,190,.18);
}

.flower{
    font-size:55px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

h1{
    margin-top:10px;
    font-size:48px;
    letter-spacing:6px;
    background:linear-gradient(90deg,#fff,#ff9fd4,#d9b2ff);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:10px;
    color:#ead8f0;
}
